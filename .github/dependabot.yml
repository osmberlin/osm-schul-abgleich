# FMC Dependabot defaults — https://github.com/FixMyBerlin/fixmyskills (skills/tech-stack)
# Schedule: first Friday of each month at 07:00 Europe/Berlin (cron FRI#1).
# Private-OSS / osmberlin cadence (same as osm-boundary-checker-germany), not FixMyCity weekly Monday.
# Keep groups, cooldown, and open-pull-requests-limit: 1 from the template.
version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /
    schedule:
      interval: cron
      cronjob: '0 7 * * FRI#1'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 1
    exclude-paths:
      - .cursor/**
    commit-message:
      prefix: chore
      include: scope
    groups:
      security-dev-tools:
        applies-to: security-updates
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
          - 'vitest*'
          - 'knip*'
          - 'husky*'
          - '@types/*'
          - 'typescript'
          - '@typescript/typescript-*'
          - 'eslint*'

      shared-monorepo-tools:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
          - '@types/bun'

      app-dev-minor-patch:
        applies-to: version-updates
        patterns:
          - '@clack/*'
          - '@heroicons/*'
          - '@total-typescript/*'
          - '@vitejs/*'
          - 'babel-plugin-*'
          - 'eslint-*'
          - 'husky'
          - 'knip'
          - 'oxfmt'
          - 'oxlint*'
          - 'vitest'
          - 'vite'
          - '@types/*'
          - 'typescript'
          - '@typescript/typescript-*'
          - 'browserslist'
          - 'browserslist-to-esbuild'
          - 'eslint-plugin-compat'
        update-types:
          - minor
          - patch

      app-framework-minor-patch:
        applies-to: version-updates
        patterns:
          - '@tanstack/*'
          - '@tailwindcss/*'
          - 'tailwindcss'
          - '@turf/*'
          - 'react'
          - 'react-dom'
          - '@types/react*'
          - 'maplibre-gl'
          - 'react-map-gl'
          - 'zod'
          - 'zustand'
        update-types:
          - minor
          - patch

      app-prod-misc-patch:
        applies-to: version-updates
        update-types:
          - patch
        patterns:
          - '*'
        exclude-patterns:
          - '@tanstack/*'
          - '@tailwindcss/*'
          - '@turf/*'
          - 'react'
          - 'react-dom'
          - 'maplibre-gl'
          - 'zod'
          - 'zustand'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 7 * * FRI#1'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
