name: Rebuild MapRoulette Tasks

on:
  workflow_dispatch:
  # Pages must have published the new public/maproulette/*.json first.
  # We still listen to Deploy GitHub Pages, but only rebuild after a full
  # Refresh Datasets run (Pages triggered by workflow_run). Code-push and
  # manual Pages deploys skip — see skip-unless-full-refresh.
  workflow_run:
    workflows: ['Deploy GitHub Pages']
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: maproulette-rebuild
  cancel-in-progress: false

jobs:
  skip-unless-full-refresh:
    name: Skip unless full dataset refresh
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Explain why MapRoulette is not rebuilt
        env:
          PAGES_TRIGGER: ${{ github.event.workflow_run.event }}
        run: |
          {
            echo "Skipping MapRoulette challenge rebuild."
            echo
            echo "This GitHub Pages deploy was triggered by '${PAGES_TRIGGER}' (code push or manual), not by Refresh Datasets."
            echo "MapRoulette tasks rebuild only after the nightly/manual full dataset refresh, once the new GeoJSON feeds are live on Pages."
            echo
            echo "To rebuild MapRoulette anyway, run this workflow manually (workflow_dispatch)."
          } | tee "$GITHUB_STEP_SUMMARY"
          echo "::notice::Skipping MapRoulette rebuild: Pages trigger was '${PAGES_TRIGGER}', not Refresh Datasets. Use workflow_dispatch to rebuild anyway."

  rebuild:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_run')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        env:
          HUSKY: '0'
      - name: Confirm hosted MapRoulette GeoJSON feeds are reachable JSON
        run: bun run maproulette:probe-feeds
      - name: Trigger MapRoulette challenge rebuild(s)
        env:
          MAPROULETTE_API_KEY: ${{ secrets.MAPROULETTE_API_KEY }}
        run: bun run maproulette:rebuild
