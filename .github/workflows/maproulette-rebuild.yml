name: Rebuild MapRoulette Tasks

on:
  workflow_dispatch:
  # After Pages publishes public/maproulette/*.json (nightly data refresh or code deploy).
  workflow_run:
    workflows: ['Deploy GitHub Pages']
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: maproulette-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        env:
          HUSKY: '0'
      - name: Confirm hosted MapRoulette GeoJSON feeds are reachable JSON
        run: bun run maproulette:probe-feeds
      - name: Trigger MapRoulette challenge rebuild(s)
        env:
          MAPROULETTE_API_KEY: ${{ secrets.MAPROULETTE_API_KEY }}
        run: bun run maproulette:rebuild
